version: 2
models:
  - name: stg_salesforce_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: currency
        data_tests:
          - accepted_values:
              values: ['USD', 'EUR', 'GBP', 'JPY']
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('stg_customers')
              field: customer_id
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
